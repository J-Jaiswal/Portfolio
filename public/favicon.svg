<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background tile -->
  <rect width="32" height="32" rx="7" fill="#0a0a0f"/>
  <!-- Accent border ring -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="none"
        stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <!-- Monogram "JJ" -->
  <text x="16" y="22"
        text-anchor="middle"
        font-family="monospace, sans-serif"
        font-size="13"
        font-weight="900"
        fill="#00e5ff"
        letter-spacing="-1">JJ</text>
</svg>
